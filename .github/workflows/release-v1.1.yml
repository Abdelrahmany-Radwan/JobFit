name: Publish v1.1.0

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/release-v1.1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Publish v1.1.0
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: |
            JobFit v1.1.0 finalizes the flagship product identity and strengthens evaluation transparency.

            Highlights:
            - Final navy / teal / pink JobFit brand system
            - IBM Plex Sans + Fraunces typography
            - Signature evidence-map interaction and product preview
            - Brand, security, changelog, and architecture documentation
            - CI validation for public product assets
            - Benchmark error-case reporting and held-out accuracy confidence interval
            - Current GitHub Action versions for Python setup

            Retrieval benchmark:
            - 48 curated requirement/evidence pairs with hard negatives
            - 28 development / 20 held-out test
            - Hybrid precision: 1.000
            - Hybrid recall: 0.846
            - Hybrid F1: 0.917
            - Hybrid accuracy: 0.900

            These metrics describe the JobFit regression benchmark and are not ATS or hiring-accuracy claims.

            Live app: https://abdelrahmany-radwan.github.io/JobFit/
        run: |
          if gh release view v1.1.0 >/dev/null 2>&1; then
            echo "v1.1.0 already exists; nothing to do."
            exit 0
          fi
          gh release create v1.1.0 \
            --target "${GITHUB_SHA}" \
            --title "JobFit v1.1.0 — Final flagship polish" \
            --notes "${RELEASE_NOTES}"
