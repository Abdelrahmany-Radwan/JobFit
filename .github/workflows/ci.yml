name: Validate project

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validate Python syntax
        run: python -m compileall -q app.py analyzer.py tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate required web files
        shell: bash
        run: |
          test -s docs/index.html
          test -s docs/style.css
          test -s docs/app.js
