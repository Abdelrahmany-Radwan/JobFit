name: Evaluate matching model

on:
  push:
    branches: ["main"]
    paths:
      - "evaluation/**"
      - ".github/workflows/evaluation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: evaluation/requirements.txt

      - name: Install evaluation dependencies
        run: python -m pip install -r evaluation/requirements.txt

      - name: Run retrieval benchmark
        run: python evaluation/evaluate.py

      - name: Publish benchmark summary
        shell: bash
        run: |
          echo "## JobFit retrieval benchmark" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`json" >> "$GITHUB_STEP_SUMMARY"
          cat evaluation/results.json >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        uses: actions/upload-artifact@v5
        with:
          name: jobfit-evaluation-results
          path: evaluation/results.json
