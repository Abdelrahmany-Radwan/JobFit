name: Bug report
description: Report a reproducible problem in JobFit
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the smallest reproducible sequence.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / environment
  - type: textarea
    id: context
    attributes:
      label: Additional context
